<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watchtower Device Monitor</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#2b180d; color:#f6ead8; margin:0; padding:24px; }
    h1 { margin:0 0 12px; }
    .layout { display:grid; grid-template-columns: 2fr minmax(300px, 1fr); gap:16px; align-items:start; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; }
    .card { background:#3f2616; border:1px solid #5b3a22; border-radius:12px; padding:12px; box-shadow: 0 18px 40px rgba(24,12,6,0.45); }
    .meta { font-size:12px; color:#d2b28f; margin-bottom:8px; }
    img { width:100%; border-radius:8px; background:#2f1b0f; }
    .status { display:flex; justify-content:space-between; margin-top:8px; font-size:12px; }
    .badge { padding:2px 6px; border-radius:999px; background:#4a2b18; color:#f6ead8; }
    .error { color:#e5a08a; }

    .hidden { display:none; }
    .auth-wrap { max-width:420px; margin: 8vh auto 0; }
    .auth-form { display:grid; gap:12px; }
    .auth-form label { display:grid; gap:6px; font-size:13px; color:#d2b28f; }
    .auth-form input {
      border-radius:8px;
      border:1px solid #5b3a22;
      background:#2f1b0f;
      color:#f6ead8;
      padding:10px;
      font-size:14px;
    }
    .btn {
      border:1px solid #5b3a22;
      background:#c98a3a;
      color:#2b180d;
      border-radius:8px;
      padding:10px;
      cursor:pointer;
      font-weight:700;
    }
  </style>
</head>
<body>
  <section id="auth" class="auth-wrap card">
    <h1>Watchtower Device Monitor Login</h1>
    <p class="meta">Enter your account credentials to access the live feed.</p>
    <form id="auth-form" class="auth-form">
      <label>
        Username
        <input id="username" name="username" autocomplete="username" required />
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button class="btn" type="submit">Login</button>
      <div id="auth-error" class="error" role="alert" aria-live="polite"></div>
    </form>
  </section>

  <section id="feed" class="hidden">
    <h1>Watchtower Device Monitor</h1>
    <p class="meta">Live camera and sensor streams served from your Watchtower hub.</p>
    <div class="layout">
      <div id="grid" class="grid"></div>
      <aside class="card" aria-label="Live chat">
        <div class="status">
          <strong>Ops Chat</strong>
          <span id="presence-count" class="badge">0 online</span>
        </div>
        <div id="presence-list" class="meta">No active users.</div>
        <div id="chat-log" style="height:320px; overflow:auto; margin:10px 0; display:grid; gap:6px;"></div>
        <form id="chat-form" class="auth-form" style="gap:8px;">
          <label>
            Display name
            <input id="display-name" maxlength="32" />
          </label>
          <label>
            Message
            <input id="chat-input" maxlength="500" placeholder="Type an update and hit Enter" required />
          </label>
          <button class="btn" type="submit">Send</button>
        </form>
      </aside>
    </div>
  </section>

  <script>
    const LOGIN_USER = 'giraff';
    const LOGIN_PASS = 'babe';
    const AUTH_KEY = 'watchtower_device_monitor_auth';
    const CHAT_WS_FALLBACK = 'wss://watchtower-kw2o.onrender.com/ws';

    const authSection = document.getElementById('auth');
    const feedSection = document.getElementById('feed');
    const authForm = document.getElementById('auth-form');
    const authError = document.getElementById('auth-error');
    const gridEl = document.getElementById('grid');
    const presenceCountEl = document.getElementById('presence-count');
    const presenceListEl = document.getElementById('presence-list');
    const chatLogEl = document.getElementById('chat-log');
    const chatFormEl = document.getElementById('chat-form');
    const chatInputEl = document.getElementById('chat-input');
    const displayNameEl = document.getElementById('display-name');
    let chatSocket = null;
    let activeName = `viewer-${Math.floor(Math.random() * 900 + 100)}`;

    function addChatLine(text, isSystem = false) {
      const line = document.createElement('div');
      line.className = 'meta';
      line.style.margin = '0';
      line.style.color = isSystem ? '#e5a08a' : '#f6ead8';
      line.textContent = text;
      chatLogEl.appendChild(line);
      chatLogEl.scrollTop = chatLogEl.scrollHeight;
    }

    function resolveChatSocketUrl() {
      const configuredUrl = window.watchtowerWsConfig?.resolveWsUrl?.() || CHAT_WS_FALLBACK;
      const wsUrl = new URL(configuredUrl);
      wsUrl.searchParams.set('name', activeName);
      return wsUrl.toString();
    }

    function connectChat() {
      if (chatSocket && (chatSocket.readyState === WebSocket.OPEN || chatSocket.readyState === WebSocket.CONNECTING)) {
        return;
      }
      chatSocket = new WebSocket(resolveChatSocketUrl());

      chatSocket.addEventListener('open', () => {
        addChatLine('Connected to multi-camera chat.', true);
      });

      chatSocket.addEventListener('message', (event) => {
        const payload = JSON.parse(event.data || '{}');
        if (payload.type === 'presence') {
          const users = Array.isArray(payload.users) ? payload.users : [];
          presenceCountEl.textContent = `${payload.count || users.length} online`;
          presenceListEl.textContent = users.length ? users.map(u => u.name || 'viewer').join(', ') : 'No active users.';
          return;
        }
        if (payload.type === 'message') {
          if (payload.system) {
            addChatLine(`[system] ${payload.text || ''}`, true);
            return;
          }
          addChatLine(`${payload.name || 'viewer'}: ${payload.text || ''}`);
        }
      });

      chatSocket.addEventListener('close', () => {
        addChatLine('Chat disconnected. Reconnecting…', true);
        setTimeout(connectChat, 1200);
      });
    }

    function showFeed() {
      authSection.classList.add('hidden');
      feedSection.classList.remove('hidden');
      loadCameras();
      connectChat();
    }

    function isAuthenticated() {
      return sessionStorage.getItem(AUTH_KEY) === '1';
    }

    async function loadCameras() {
      const res = await fetch('/api/cameras');
      const data = await res.json();
      if (!data.ok) {
        gridEl.innerHTML = `<div class="card">${data.error}</div>`;
        return;
      }
      gridEl.innerHTML = '';
      data.cameras.forEach(cam => {
        const card = document.createElement('div');
        card.className = 'card';
        const fps = Number(cam.stats?.fps || 0);
        const frames = Number(cam.stats?.frames || 0);
        const cloudAge = cam.cloud?.last_upload_age_s;
        const freshness = typeof cloudAge === 'number'
          ? ` · uploaded ${cloudAge.toFixed(1)}s ago`
          : '';
        const err = cam.stats?.last_error ? `<span class="error">${cam.stats.last_error}</span>` : '<span class="badge">LIVE</span>';
        card.innerHTML = `
          <div class="meta"><strong>${cam.id}</strong> · ${cam.type} · ${cam.resolution} @ ${cam.fps_target}fps${freshness}</div>
          <img src="/api/cameras/${cam.id}/mjpeg" alt="${cam.id}" />
          <div class="status">
            <span>fps: ${fps.toFixed(1)} frames: ${frames}</span>
            ${err}
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    authForm.addEventListener('submit', (event) => {
      event.preventDefault();
      authError.textContent = '';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      if (username === LOGIN_USER && password === LOGIN_PASS) {
        sessionStorage.setItem(AUTH_KEY, '1');
        showFeed();
        return;
      }
      authError.textContent = 'Invalid username or password.';
    });

    chatFormEl.addEventListener('submit', (event) => {
      event.preventDefault();
      const nextName = (displayNameEl.value || '').trim().slice(0, 32);
      if (nextName && nextName !== activeName) {
        activeName = nextName;
        if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
          chatSocket.send(JSON.stringify({ type: 'rename', name: activeName }));
        }
      }

      const text = (chatInputEl.value || '').trim();
      if (!text || !chatSocket || chatSocket.readyState !== WebSocket.OPEN) {
        return;
      }
      chatSocket.send(JSON.stringify({ type: 'message', text }));
      chatInputEl.value = '';
    });

    if (isAuthenticated()) {
      showFeed();
    }

    setInterval(() => {
      if (!feedSection.classList.contains('hidden')) {
        loadCameras();
      }
    }, 5000);
  </script>
</body>
</html>
