<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RedNode Multi-Camera Monitor</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0b0f16; color:#e6eefc; margin:0; padding:24px; }
    h1 { margin:0 0 12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; }
    .card { background:#111827; border:1px solid #1f2937; border-radius:12px; padding:12px; }
    .meta { font-size:12px; color:#9ca3af; margin-bottom:8px; }
    img { width:100%; border-radius:8px; background:#0f172a; }
    .status { display:flex; justify-content:space-between; margin-top:8px; font-size:12px; }
    .badge { padding:2px 6px; border-radius:999px; background:#1f2937; }
    .error { color:#fca5a5; }
  </style>
</head>
<body>
  <h1>Multi-Camera Monitor</h1>
  <p class="meta">Streams are served over MJPEG from the local FastAPI server.</p>
  <div id="grid" class="grid"></div>

  <script>
    async function loadCameras() {
      const res = await fetch('/api/cameras');
      const data = await res.json();
      if (!data.ok) {
        document.getElementById('grid').innerHTML = `<div class="card">${data.error}</div>`;
        return;
      }
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      data.cameras.forEach(cam => {
        const card = document.createElement('div');
        card.className = 'card';
        const err = cam.stats?.last_error ? `<span class="error">${cam.stats.last_error}</span>` : '<span class="badge">OK</span>';
        card.innerHTML = `
          <div class="meta"><strong>${cam.id}</strong> · ${cam.type} · ${cam.resolution} @ ${cam.fps_target}fps</div>
          <img src="/api/cameras/${cam.id}/mjpeg" alt="${cam.id}" />
          <div class="status">
            <span>fps: ${cam.stats.fps.toFixed(1)} frames: ${cam.stats.frames}</span>
            ${err}
          </div>
        `;
        grid.appendChild(card);
      });
    }
    loadCameras();
    setInterval(loadCameras, 5000);
  </script>
</body>
</html>
