<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watchtower Device Monitor</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#2b180d; color:#f6ead8; margin:0; padding:24px; }
    h1 { margin:0 0 12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; }
    .card { background:#3f2616; border:1px solid #5b3a22; border-radius:12px; padding:12px; box-shadow: 0 18px 40px rgba(24,12,6,0.45); }
    .meta { font-size:12px; color:#d2b28f; margin-bottom:8px; }
    img { width:100%; border-radius:8px; background:#2f1b0f; }
    .status { display:flex; justify-content:space-between; margin-top:8px; font-size:12px; }
    .badge { padding:2px 6px; border-radius:999px; background:#4a2b18; color:#f6ead8; }
    .error { color:#e5a08a; }
  </style>
</head>
<body>
  <h1>Watchtower Device Monitor</h1>
  <p class="meta">Live camera and sensor streams served from your Watchtower hub.</p>
  <div id="grid" class="grid"></div>
  <p class="meta" id="ws-state">WS: connecting…</p>

  <script src="/static/js/ws-config.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const CLOUD_HTTP_BASE = window.watchtowerWsConfig?.cloudHttpBase || 'https://watchtower-3l5i.onrender.com';
    function normalizeHttpBase(value) {
      const raw = (value || '').trim();
      if (!raw) return '';
      if (/^https?:\/\//i.test(raw)) return raw.replace(/\/+$/, '');
      return `${location.protocol}//${raw.replace(/\/+$/, '')}`;
    }

    function deriveApiBase() {
      const params = new URLSearchParams(location.search);
      const fromQuery = normalizeHttpBase(params.get('api'));
      if (fromQuery) return fromQuery;

      const fromStorage = normalizeHttpBase(localStorage.getItem('watchtower_api_base'));
      if (fromStorage) {
        localStorage.setItem('watchtower_api_base', fromStorage);
        return fromStorage;
      }

      if (window.WATCHTOWER_API_BASE) return normalizeHttpBase(window.WATCHTOWER_API_BASE);

      return CLOUD_HTTP_BASE;
    }

    const apiBase = deriveApiBase();
    const apiPrefix = apiBase || '';

    function apiUrl(path) {
      return `${apiPrefix}${path}`;
    }

    async function loadCameras() {
      try {
        const res = await fetch(apiUrl('/api/cameras'));
        const data = await res.json();
        if (!data.ok) {
          $('grid').innerHTML = `<div class="card">${data.error || 'Unable to load cameras'}</div>`;
          return;
        }

        const grid = $('grid');
        grid.innerHTML = '';
        data.cameras.forEach(cam => {
          const card = document.createElement('div');
          card.className = 'card';
          const err = cam.stats?.last_error ? `<span class="error">${cam.stats.last_error}</span>` : '<span class="badge">OK</span>';
          card.innerHTML = `
            <div class="meta"><strong>${cam.id}</strong> · ${cam.type} · ${cam.resolution} @ ${cam.fps_target}fps</div>
            <img src="${apiUrl(`/api/cameras/${cam.id}/mjpeg`)}" alt="${cam.id}" />
            <div class="status">
              <span>fps: ${cam.stats.fps.toFixed(1)} frames: ${cam.stats.frames}</span>
              ${err}
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        $('grid').innerHTML = `<div class="card">Camera API bridge error. Configure <code>?api=https://watchtower-api-host</code>.</div>`;
      }
    }

    loadCameras();
    setInterval(loadCameras, 5000);

    let ws;
    let wsTimer;
    let wsDelay = 1000;
    const wsStateEl = $('ws-state');

    function setWsState(text){
      if (wsStateEl) wsStateEl.textContent = `WS: ${text}`;
    }

    function connectPresenceWs(){
      const wsUrl = window.watchtowerWsConfig?.resolveWsUrl?.(apiBase) || 'wss://watchtower-3l5i.onrender.com/ws';
      setWsState(`connecting ${wsUrl}`);
      try {
        ws = new WebSocket(wsUrl);
      } catch (_err) {
        setWsState('error (retrying)');
        scheduleWsReconnect();
        return;
      }

      ws.addEventListener('open', () => {
        wsDelay = 1000;
        setWsState(`live · api ${apiBase}`);
        try { ws.send(JSON.stringify({ type: 'join', user: 'multi-camera' })); } catch (_err) {}
      });
      ws.addEventListener('close', () => {
        setWsState('disconnected (retrying)');
        scheduleWsReconnect();
      });
      ws.addEventListener('error', () => {
        setWsState('error (retrying)');
        try { ws.close(); } catch (_err) {}
      });
    }

    function scheduleWsReconnect(){
      if (wsTimer) clearTimeout(wsTimer);
      wsTimer = setTimeout(() => {
        wsDelay = Math.min(15000, Math.floor(wsDelay * 1.7));
        connectPresenceWs();
      }, wsDelay);
    }

    connectPresenceWs();
  </script>
</body>
</html>
