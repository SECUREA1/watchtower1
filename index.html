<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RedNode COCO-SSD Mobile/WebView Test</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      header {
        padding: 16px 20px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
      }
      main {
        display: grid;
        gap: 16px;
        padding: 16px;
      }
      .stage {
        position: relative;
        max-width: 960px;
        margin: 0 auto;
      }
      video,
      canvas {
        width: 100%;
        border-radius: 12px;
      }
      canvas {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .controls .secondary {
        background: transparent;
        color: #e2e8f0;
        border: 1px solid #38bdf8;
      }
      button {
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        background: #38bdf8;
        color: #0f172a;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.6;
      }
      .log {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #020617;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 12px;
        white-space: pre-wrap;
        max-height: 220px;
        overflow-y: auto;
      }
      dialog {
        border: 1px solid #1e293b;
        border-radius: 16px;
        padding: 0;
        background: #0b1220;
        color: #e2e8f0;
        width: min(960px, 92vw);
      }
      dialog::backdrop {
        background: rgba(15, 23, 42, 0.85);
      }
      .menu-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid #1e293b;
        background: #111827;
      }
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        padding: 20px;
      }
      .menu-tile {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 140px;
      }
      .menu-tile h4 {
        margin: 0;
        font-size: 16px;
        line-height: 1.3;
      }
      .menu-tile p {
        margin: 0;
        font-size: 13px;
        color: #94a3b8;
      }
      .menu-actions {
        margin-top: auto;
        display: flex;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>RedNode COCO-SSD Mobile/WebView Test</h1>
      <p>Loads TFJS + COCO-SSD with backend fallback and optional server detection.</p>
    </header>
    <main>
      <section class="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </section>
      <section class="controls">
        <button id="start">Start Camera + Detection</button>
        <button id="stop" disabled>Stop</button>
        <button id="open-menu" class="secondary" type="button">
          Open Gaming Menu
        </button>
      </section>
      <section>
        <h3>Logs</h3>
        <div id="log" class="log"></div>
      </section>
    </main>

    <dialog id="game-menu">
      <div class="menu-header">
        <div>
          <h2>Gaming Scripts</h2>
          <p>Select a title to launch immediately.</p>
        </div>
        <button id="close-menu" class="secondary" type="button">Close</button>
      </div>
      <div id="menu-grid" class="menu-grid"></div>
    </dialog>

    <script type="module">
      import {
        initDetection,
        detectLoop,
        drawDetections,
        createLogger,
      } from './site/detection.js';

      const video = document.getElementById('video');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('start');
      const stopBtn = document.getElementById('stop');
      const logEl = document.getElementById('log');
      const menuDialog = document.getElementById('game-menu');
      const openMenuBtn = document.getElementById('open-menu');
      const closeMenuBtn = document.getElementById('close-menu');
      const menuGrid = document.getElementById('menu-grid');

      const logger = createLogger(logEl);
      let stopLoop = null;
      let mediaStream = null;
      const gameScripts = [
        'Camera Basketball _ Pinch Grab_Hold _ Live Tuner + Scroll _ 80s Synthwave Audio.html',
        'DRONE DIG + SCOOP — DUAL HAND ISO CONTROLS.html',
        'Excavator Job Site — Gesture Driven.html',
        'Excavator — Terrain Map + Hand-Training Startup Calibration + Micro-Movement Tuner.html',
        'Eye Cursor Trainer (Solid Calibration + Blink Click + Fun Guide) final extendion - Copy.html',
        'Gesture Billiards Pro (2P).html',
        'Gesture Basketball Arcade — Multi-Mode + 6 Balls + Aim Assist Training.html',
        'Golden Eye_ Retina Ops — Full Upgrade (Green Edge HUD + Collapsible Tables).html',
        'GoldenEye_RetinaOps_FaceCursor_BlinkShoot_HandPie_SVGPlayers.html',
        'Hand Cube Control_ Open=Rotate _ Fist=Move _ Pinch+Spread=Expand _ Pinch+Push_Pull=Zoom.html',
        'IONCORE Poker — Secure Gesture Login + Glass UI + Full Audio + AI Traits.html',
        'IONCORE • RAD-TOX FIELD (FULL + PRO AUDIO).html',
        'PickStorm AR — Two-Hand Air Guitar.html',
        'Laser Eyes HUD — Gaze Cursor + Wizard + Shockwave Shooter + Vision AR (Faces_Objects + Logging).html',
        'Laser Eyes HUD — Gaze Cursor + Wizard + Training + Asteroid_Drone Shooter - Copy - Copy - Copy (3) - Copy - Copy - Copy - Copy.html',
        'Laser Eyes HUD — Gaze Cursor + Wizard + Training + Asteroid_Drone Shooter.html',
        'Mobile Mini Putt — Pinch Lock + Pinch Shoot.html',
        'RedAR + IonEye — Multi-Cam + Face_Object + Sentinel + WebXR.html',
        'RedNode Arcade — Troll Climber (2-Hand Auth + Pinch Jump Endless).html',
        'RedNode Blackjack — Secure Login.html',
        'RedNode Chess — Secure Login.html',
        'RedNode Dashboard — Full Demo.html',
        'RedNode Dashboard — Indoor Ops · Sentinel · Demo.html',
        'RedNode Slots.html',
        'RedNode — Eye Pro (Fleet XR Console).html',
        'RedNode — Locked Views Excavator (2-Hand ISO Controls + Sensitivity Tuners).html',
        'RedNode — Node Eye Console.html',
        'RedNode.ai — Abyss Pilot (Submarine Viewport HUD).html',
        'Rednode Excavation — Gesture Controlled Sim.html',
        'Rednode Sentinel — Drone Dig + Pile + Boom Side View (Hands Full Control).html',
        'Rednode Sentinel — Drone Dig + Pile + Boom Side View.html',
        'Rednode • Pinch Paint Arena (WebXR).html',
        'Space Saber — UFO Slice (Zap Saber + Checkpoint Health) - Copy.html',
        'WPA 8-Ball (Gesture) – 2 Player.html',
        'ar-dashboard.html',
        'basketball_script_post_spring_trail_v2.html',
        'dadda - Copy - Copy.html',
        'gesture_mini_putt_pro - Copy - Copy.html',
        'gesture_mini_putt_pro - Copy.html',
        'golden_eye_retina_ops_camera_download_operational - Copy - Copy.html',
        'golden_eye_retina_ops_camera_download_operational - Copy.html',
        'golden_eye_retina_ops_camera_download_operational.html',
        'market.html',
        'Muzikaz-style Avatar (SVG) • Hat • Bug Eyes • Teeth • Ears.html',
        'pitchsimpro_baseball_scene_updated_v2.html',
        'pitchsimpro_baseball_scene_updated_v3.html',
        'spaces.html',
      ];

      function renderMenu() {
        menuGrid.innerHTML = '';
        gameScripts.forEach((fileName) => {
          const tile = document.createElement('div');
          tile.className = 'menu-tile';

          const title = document.createElement('h4');
          title.textContent = fileName.replace(/\.html$/, '');

          const subtitle = document.createElement('p');
          subtitle.textContent = fileName;

          const actions = document.createElement('div');
          actions.className = 'menu-actions';

          const playButton = document.createElement('button');
          playButton.type = 'button';
          playButton.textContent = 'Open & Play';
          playButton.addEventListener('click', () => {
            window.location.href = encodeURI(fileName);
          });

          actions.appendChild(playButton);
          tile.append(title, subtitle, actions);
          menuGrid.appendChild(tile);
        });
      }

      async function startCamera() {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false,
        });
        video.srcObject = mediaStream;
        await video.play();
      }

      function stopCamera() {
        if (mediaStream) {
          mediaStream.getTracks().forEach((track) => track.stop());
          mediaStream = null;
        }
        video.srcObject = null;
      }

      startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        try {
          await startCamera();
          const { model, usingServerFallback } = await initDetection({
            logger,
            serverUrl: 'http://localhost:8000/detect',
            wasmPath: 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@3.21.0/dist/',
          });

          stopLoop = detectLoop(video, (result) => {
            drawDetections(overlay, video, result);
          }, {
            fps: 8,
            maxSize: 640,
            model,
            usingServerFallback,
            logger,
            serverUrl: 'http://localhost:8000/detect',
          });

          stopBtn.disabled = false;
        } catch (error) {
          logger.error('Failed to start detection', error);
          startBtn.disabled = false;
        }
      });

      stopBtn.addEventListener('click', () => {
        if (stopLoop) {
          stopLoop();
          stopLoop = null;
        }
        stopCamera();
        startBtn.disabled = false;
        stopBtn.disabled = true;
      });

      openMenuBtn.addEventListener('click', () => {
        renderMenu();
        menuDialog.showModal();
      });

      closeMenuBtn.addEventListener('click', () => {
        menuDialog.close();
      });
    </script>
  </body>
</html>
