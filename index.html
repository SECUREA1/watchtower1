<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RedNode COCO-SSD Mobile/WebView Test</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      header {
        padding: 16px 20px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
      }
      main {
        display: grid;
        gap: 16px;
        padding: 16px;
      }
      .stage {
        position: relative;
        max-width: 960px;
        margin: 0 auto;
      }
      video,
      canvas {
        width: 100%;
        border-radius: 12px;
      }
      canvas {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      button {
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        background: #38bdf8;
        color: #0f172a;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.6;
      }
      .log {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #020617;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 12px;
        white-space: pre-wrap;
        max-height: 220px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>RedNode COCO-SSD Mobile/WebView Test</h1>
      <p>Loads TFJS + COCO-SSD with backend fallback and optional server detection.</p>
    </header>
    <main>
      <section class="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </section>
      <section class="controls">
        <button id="start">Start Camera + Detection</button>
        <button id="stop" disabled>Stop</button>
      </section>
      <section>
        <h3>Logs</h3>
        <div id="log" class="log"></div>
      </section>
    </main>

    <script type="module">
      import {
        initDetection,
        detectLoop,
        drawDetections,
        createLogger,
      } from './detection.js';

      const video = document.getElementById('video');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('start');
      const stopBtn = document.getElementById('stop');
      const logEl = document.getElementById('log');

      const logger = createLogger(logEl);
      let stopLoop = null;
      let mediaStream = null;

      async function startCamera() {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false,
        });
        video.srcObject = mediaStream;
        await video.play();
      }

      function stopCamera() {
        if (mediaStream) {
          mediaStream.getTracks().forEach((track) => track.stop());
          mediaStream = null;
        }
        video.srcObject = null;
      }

      startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        try {
          await startCamera();
          const { model, usingServerFallback } = await initDetection({
            logger,
            serverUrl: 'http://localhost:8000/detect',
            wasmPath: 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@3.21.0/dist/',
          });

          stopLoop = detectLoop(video, (result) => {
            drawDetections(overlay, video, result);
          }, {
            fps: 8,
            maxSize: 640,
            model,
            usingServerFallback,
            logger,
            serverUrl: 'http://localhost:8000/detect',
          });

          stopBtn.disabled = false;
        } catch (error) {
          logger.error('Failed to start detection', error);
          startBtn.disabled = false;
        }
      });

      stopBtn.addEventListener('click', () => {
        if (stopLoop) {
          stopLoop();
          stopLoop = null;
        }
        stopCamera();
        startBtn.disabled = false;
        stopBtn.disabled = true;
      });
    </script>
  </body>
</html>
