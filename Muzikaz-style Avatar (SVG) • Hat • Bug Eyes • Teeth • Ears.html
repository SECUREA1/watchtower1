<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Muzikaz-style Avatar (SVG) • Hat • Bug Eyes • Teeth • Ears</title>

  <style>
    html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    #app{position:relative;width:100%;height:100%}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    svg{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
    #hud{
      position:absolute;left:16px;top:16px;width:min(640px,calc(100% - 32px));
      background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
      border-radius:14px;padding:14px;backdrop-filter:blur(10px);
      box-shadow:0 12px 30px rgba(0,0,0,.45);color:rgba(255,255,255,.92);pointer-events:auto
    }
    #row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
    #title{font-size:14px;font-weight:800;margin:0}
    #status{font-size:12px;opacity:.8}
    .grid{display:grid;grid-template-columns:1fr auto;gap:10px 12px;margin-top:12px;align-items:center}
    label{font-size:12px;opacity:.85}
    input[type="range"]{width:250px}
    .toggles{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .toggle{display:inline-flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10)}
    .toggle input{transform:translateY(1px)}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
</head>

<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>

  <svg id="overlay" viewBox="0 0 640 480" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Fur base (muzikaz red) -->
      <radialGradient id="furGrad" gradientUnits="userSpaceOnUse">
        <stop offset="0%"  stop-color="#e4572c"/>
        <stop offset="55%" stop-color="#a73317"/>
        <stop offset="100%" stop-color="#3b1309"/>
      </radialGradient>

      <!-- Rim shade -->
      <radialGradient id="furRimGrad" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#000" stop-opacity="0"/>
        <stop offset="70%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0.28"/>
      </radialGradient>

      <!-- Horn -->
      <linearGradient id="hornGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#fbf7ee"/>
        <stop offset="45%"  stop-color="#efe3cf"/>
        <stop offset="100%" stop-color="#c8ad8d"/>
      </linearGradient>

      <radialGradient id="hornSocketGrad" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>

      <!-- Alien nose (green) -->
      <radialGradient id="noseGrad" gradientUnits="userSpaceOnUse">
        <stop offset="0%"   stop-color="#77ff99"/>
        <stop offset="62%"  stop-color="#19d561"/>
        <stop offset="100%" stop-color="#0a5f2c"/>
      </radialGradient>

      <radialGradient id="noseHi" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>

      <!-- Hat gradients -->
      <linearGradient id="hatGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e262c"/>
        <stop offset="55%" stop-color="#0f1519"/>
        <stop offset="100%" stop-color="#070a0c"/>
      </linearGradient>

      <linearGradient id="brimGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#11181d"/>
        <stop offset="100%" stop-color="#050708"/>
      </linearGradient>

      <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%">
        <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.55"/>
      </filter>

      <filter id="eyeShadow" x="-45%" y="-45%" width="190%" height="190%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/>
      </filter>

      <!-- Clip inside head -->
      <clipPath id="faceClip">
        <path id="clipPathFace" d=""/>
      </clipPath>
    </defs>

    <!-- FUR SHELLS -->
    <g id="furShells" opacity="1">
      <path id="furOuter1" fill="url(#furGrad)" opacity="0.34"/>
      <path id="furOuter2" fill="url(#furGrad)" opacity="0.24"/>
      <path id="furOuter3" fill="url(#furGrad)" opacity="0.16"/>
      <path id="furRim"    fill="url(#furRimGrad)" opacity="0.60"/>
      <path id="cheekTuftL" fill="url(#furGrad)" opacity="0.62"/>
      <path id="cheekTuftR" fill="url(#furGrad)" opacity="0.62"/>
      <path id="jawTufts"  fill="url(#furGrad)" opacity="0.52"/>
    </g>

    <!-- HORNS (behind hat to mimic reference) -->
    <g id="horns" opacity="1" filter="url(#softShadow)">
      <path id="hornSocketL" fill="url(#hornSocketGrad)" opacity="0.55"/>
      <path id="hornSocketR" fill="url(#hornSocketGrad)" opacity="0.55"/>
      <path id="hornL" fill="url(#hornGrad)" stroke="rgba(60,45,30,0.45)" stroke-width="2"/>
      <path id="hornR" fill="url(#hornGrad)" stroke="rgba(60,45,30,0.45)" stroke-width="2"/>
      <path id="hornRidgesL" fill="none" stroke="rgba(90,70,45,0.35)" stroke-width="2" stroke-linecap="round"/>
      <path id="hornRidgesR" fill="none" stroke="rgba(90,70,45,0.35)" stroke-width="2" stroke-linecap="round"/>
      <path id="hornRootL" fill="rgba(0,0,0,0.18)"/>
      <path id="hornRootR" fill="rgba(0,0,0,0.18)"/>
    </g>

    <!-- EARS (larger “muzikaz” pointers) -->
    <g id="ears" opacity="1" filter="url(#softShadow)">
      <path id="earL" fill="url(#furGrad)"/>
      <path id="earR" fill="url(#furGrad)"/>
      <path id="earInnerL" fill="rgba(240,210,190,0.22)"/>
      <path id="earInnerR" fill="rgba(240,210,190,0.22)"/>
      <path id="earEdgeL" fill="none" stroke="rgba(0,0,0,0.40)" stroke-width="3" stroke-linejoin="round"/>
      <path id="earEdgeR" fill="none" stroke="rgba(0,0,0,0.40)" stroke-width="3" stroke-linejoin="round"/>
      <!-- ear notch lines -->
      <path id="earLinesL" fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="3" stroke-linecap="round"/>
      <path id="earLinesR" fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- HAT (front layer like the reference) -->
    <g id="hat" opacity="1" filter="url(#softShadow)">
      <path id="hatCrown" fill="url(#hatGrad)"/>
      <path id="hatBrim" fill="url(#brimGrad)"/>
      <path id="hatSeam" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round"/>
      <path id="hatUnder" fill="rgba(0,0,0,0.28)"/>
      <!-- green logo -->
      <path id="hatLogo" fill="#40d66b" opacity="0.95"/>
      <path id="hatLogoShadow" fill="rgba(0,0,0,0.28)"/>
    </g>

    <!-- HEAD -->
    <g id="mask" opacity="1">
      <path id="face" fill="url(#furGrad)"/>

      <g clip-path="url(#faceClip)">
        <!-- Nose -->
        <path id="nosePlate" fill="rgba(0,0,0,0.18)"/>
        <path id="nose" fill="url(#noseGrad)" opacity="0.98"/>
        <path id="noseHighlight" fill="url(#noseHi)" opacity="0.55"/>
        <ellipse id="nostrilL" fill="#0b0706" opacity="0.80"/>
        <ellipse id="nostrilR" fill="#0b0706" opacity="0.80"/>

        <!-- Mouth -->
        <path id="mouthOpen" fill="#120705" opacity="0.0"/>
        <path id="mouthLine" fill="none" stroke="#060201" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.82"/>
        <path id="teethUpper" fill="#f2eadc" opacity="0.0"/>
        <path id="teethLower" fill="#f2eadc" opacity="0.0"/>
        <path id="fangs" fill="#f2eadc" opacity="0.0"/>
        <path id="tongue" fill="#7c2b2b" opacity="0.0"/>
      </g>

      <!-- Bug Eyes + brows -->
      <g id="eyes" filter="url(#eyeShadow)">
        <ellipse id="eyeWhiteL" fill="#ffffff" opacity="0.98" stroke="#0b0706" stroke-width="7"/>
        <ellipse id="eyeWhiteR" fill="#ffffff" opacity="0.98" stroke="#0b0706" stroke-width="7"/>

        <ellipse id="pupilL" fill="#070201"/>
        <ellipse id="pupilR" fill="#070201"/>

        <circle id="eyeHL" r="3.5" fill="#ffffff" opacity="0.65"/>
        <circle id="eyeHR" r="3.5" fill="#ffffff" opacity="0.65"/>

        <!-- Eyelids -->
        <path id="lidUpperL" fill="url(#furGrad)" opacity="0.0"/>
        <path id="lidUpperR" fill="url(#furGrad)" opacity="0.0"/>
        <path id="lidLowerL" fill="url(#furGrad)" opacity="0.0"/>
        <path id="lidLowerR" fill="url(#furGrad)" opacity="0.0"/>

        <!-- Brows -->
        <path id="browL" fill="none" stroke="#0b0706" stroke-width="12" stroke-linecap="round"/>
        <path id="browR" fill="none" stroke="#0b0706" stroke-width="12" stroke-linecap="round"/>
      </g>
    </g>
  </svg>

  <div id="hud">
    <div id="row1">
      <div id="title">Muzikaz-style SVG Avatar (Hat • Bug Eyes • Teeth • Ears)</div>
      <div id="status">Initializing…</div>
    </div>

    <div class="grid">
      <label for="maskOpacity">Mask opacity</label>
      <input id="maskOpacity" type="range" min="0" max="100" value="92"/>

      <label for="smooth">Smoothing</label>
      <input id="smooth" type="range" min="0" max="95" value="78"/>

      <label for="blinkSense">Blink sensitivity</label>
      <input id="blinkSense" type="range" min="10" max="40" value="22"/>

      <label for="furAmount">Furry edge strength</label>
      <input id="furAmount" type="range" min="0" max="100" value="82"/>

      <label for="eyePop">Bug eye size</label>
      <input id="eyePop" type="range" min="100" max="220" value="165"/>
    </div>

    <div class="toggles">
      <label class="toggle"><input id="showVideo" type="checkbox" checked/> Show video</label>
      <label class="toggle"><input id="showDebug" type="checkbox"/> Debug outline</label>
    </div>
  </div>
</div>

<script>
(() => {
  const video = document.getElementById("video");
  const statusEl = document.getElementById("status");

  const maskOpacityEl = document.getElementById("maskOpacity");
  const smoothEl = document.getElementById("smooth");
  const blinkSenseEl = document.getElementById("blinkSense");
  const furAmountEl = document.getElementById("furAmount");
  const eyePopEl = document.getElementById("eyePop");
  const showVideoEl = document.getElementById("showVideo");
  const showDebugEl = document.getElementById("showDebug");

  const facePath = document.getElementById("face");
  const clipPathFace = document.getElementById("clipPathFace");

  const furGrad = document.getElementById("furGrad");
  const furRimGrad = document.getElementById("furRimGrad");

  const furOuter1 = document.getElementById("furOuter1");
  const furOuter2 = document.getElementById("furOuter2");
  const furOuter3 = document.getElementById("furOuter3");
  const furRim = document.getElementById("furRim");
  const cheekTuftL = document.getElementById("cheekTuftL");
  const cheekTuftR = document.getElementById("cheekTuftR");
  const jawTufts = document.getElementById("jawTufts");

  const hornSocketGrad = document.getElementById("hornSocketGrad");
  const hornSocketL = document.getElementById("hornSocketL");
  const hornSocketR = document.getElementById("hornSocketR");
  const hornL = document.getElementById("hornL");
  const hornR = document.getElementById("hornR");
  const hornRidgesL = document.getElementById("hornRidgesL");
  const hornRidgesR = document.getElementById("hornRidgesR");
  const hornRootL = document.getElementById("hornRootL");
  const hornRootR = document.getElementById("hornRootR");

  const earL = document.getElementById("earL");
  const earR = document.getElementById("earR");
  const earInnerL = document.getElementById("earInnerL");
  const earInnerR = document.getElementById("earInnerR");
  const earEdgeL = document.getElementById("earEdgeL");
  const earEdgeR = document.getElementById("earEdgeR");
  const earLinesL = document.getElementById("earLinesL");
  const earLinesR = document.getElementById("earLinesR");

  const hatCrown = document.getElementById("hatCrown");
  const hatBrim  = document.getElementById("hatBrim");
  const hatSeam  = document.getElementById("hatSeam");
  const hatUnder = document.getElementById("hatUnder");
  const hatLogo  = document.getElementById("hatLogo");
  const hatLogoShadow = document.getElementById("hatLogoShadow");

  const noseGrad = document.getElementById("noseGrad");
  const noseHi = document.getElementById("noseHi");
  const nosePlate = document.getElementById("nosePlate");
  const nose = document.getElementById("nose");
  const noseHighlight = document.getElementById("noseHighlight");
  const nostrilL = document.getElementById("nostrilL");
  const nostrilR = document.getElementById("nostrilR");

  const mouthOpen = document.getElementById("mouthOpen");
  const mouthLine = document.getElementById("mouthLine");
  const teethUpper = document.getElementById("teethUpper");
  const teethLower = document.getElementById("teethLower");
  const fangs = document.getElementById("fangs");
  const tongue = document.getElementById("tongue");

  const eyeWhiteL = document.getElementById("eyeWhiteL");
  const eyeWhiteR = document.getElementById("eyeWhiteR");
  const pupilL = document.getElementById("pupilL");
  const pupilR = document.getElementById("pupilR");
  const eyeHL = document.getElementById("eyeHL");
  const eyeHR = document.getElementById("eyeHR");

  const lidUpperL = document.getElementById("lidUpperL");
  const lidUpperR = document.getElementById("lidUpperR");
  const lidLowerL = document.getElementById("lidLowerL");
  const lidLowerR = document.getElementById("lidLowerR");

  const browL = document.getElementById("browL");
  const browR = document.getElementById("browR");

  let debugGroup = null;
  const svg = document.getElementById("overlay");
  function ensureDebug() {
    if (debugGroup) return;
    debugGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
    debugGroup.setAttribute("id","debug");
    svg.appendChild(debugGroup);
  }
  function drawDebugPoints(points) {
    ensureDebug();
    debugGroup.innerHTML = "";
    for (const p of points) {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", p.x); c.setAttribute("cy", p.y);
      c.setAttribute("r", 2.0);
      c.setAttribute("fill", "rgba(0,255,180,0.85)");
      debugGroup.appendChild(c);
    }
  }

  function setStatus(t){ statusEl.textContent=t; }
  function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function hash01(i){ const s = Math.sin(i*127.1)*43758.5453123; return s - Math.floor(s); }

  // Face oval indices (stable)
  const FACE_OVAL = [
    10,338,297,332,284,251,389,356,454,
    323,361,288,397,365,379,378,400,377,152,
    148,176,149,150,136,172,58,132,93,234,
    127,162,21,54,103
  ];

  function densify(points, insertsPerEdge=2) {
    const out = [];
    for (let i=0;i<points.length;i++){
      const a = points[i];
      const b = points[(i+1)%points.length];
      out.push(a);
      for (let k=1;k<=insertsPerEdge;k++){
        const t = k/(insertsPerEdge+1);
        out.push({ x: lerp(a.x,b.x,t), y: lerp(a.y,b.y,t) });
      }
    }
    return out;
  }

  function closedCatmullRomPath(points, tension=0.70){
    const n=points.length;
    if(n<3) return "";
    let d=`M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
    for(let i=0;i<n;i++){
      const p0=points[(i-1+n)%n], p1=points[i], p2=points[(i+1)%n], p3=points[(i+2)%n];
      const t=tension;
      const cp1x=p1.x+(p2.x-p0.x)*t/6, cp1y=p1.y+(p2.y-p0.y)*t/6;
      const cp2x=p2.x-(p3.x-p1.x)*t/6, cp2y=p2.y-(p3.y-p1.y)*t/6;
      d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
    }
    return d+" Z";
  }

  function furPoints(basePts, cx, cy, ampPx, freq=1.0, jawBias=0.0){
    const out=[];
    for(let i=0;i<basePts.length;i++){
      const p=basePts[i];
      const vx=p.x-cx, vy=p.y-cy;
      const len=Math.hypot(vx,vy)||1;
      const nx=vx/len, ny=vy/len;

      const t=i/basePts.length;
      const wave=Math.sin((t*Math.PI*2)*(9*freq))*0.55+0.55;
      const jit=(hash01(i+11)-0.5)*0.55;

      const jaw=clamp((p.y-cy)/(240),0,1);
      const jawBoost=1 + jawBias*jaw*jaw;

      const spike=ampPx*jawBoost*(0.30+0.86*wave+0.35*jit);
      out.push({x:p.x+nx*spike, y:p.y+ny*spike});
    }
    return out;
  }

  function roundedOvalPath(cx,cy,rx,ry){
    const k=0.5522847498307936, ox=rx*k, oy=ry*k;
    return [
      `M ${(cx-rx).toFixed(2)} ${cy.toFixed(2)}`,
      `C ${(cx-rx).toFixed(2)} ${(cy-oy).toFixed(2)}, ${(cx-ox).toFixed(2)} ${(cy-ry).toFixed(2)}, ${cx.toFixed(2)} ${(cy-ry).toFixed(2)}`,
      `C ${(cx+ox).toFixed(2)} ${(cy-ry).toFixed(2)}, ${(cx+rx).toFixed(2)} ${(cy-oy).toFixed(2)}, ${(cx+rx).toFixed(2)} ${cy.toFixed(2)}`,
      `C ${(cx+rx).toFixed(2)} ${(cy+oy).toFixed(2)}, ${(cx+ox).toFixed(2)} ${(cy+ry).toFixed(2)}, ${cx.toFixed(2)} ${(cy+ry).toFixed(2)}`,
      `C ${(cx-ox).toFixed(2)} ${(cy+ry).toFixed(2)}, ${(cx-rx).toFixed(2)} ${(cy+oy).toFixed(2)}, ${(cx-rx).toFixed(2)} ${cy.toFixed(2)}`,
      "Z"
    ].join(" ");
  }

  function alienNosePath(cx,cy,w,h){
    const x0=cx-w*0.62, x1=cx+w*0.62;
    const y0=cy-h*0.40, y1=cy+h*0.62;
    return [
      `M ${cx.toFixed(2)} ${y0.toFixed(2)}`,
      `C ${(cx-w*0.70).toFixed(2)} ${(cy-h*0.20).toFixed(2)}, ${x0.toFixed(2)} ${(cy+h*0.10).toFixed(2)}, ${(cx-w*0.48).toFixed(2)} ${(cy+h*0.34).toFixed(2)}`,
      `C ${(cx-w*0.20).toFixed(2)} ${y1.toFixed(2)}, ${(cx+w*0.20).toFixed(2)} ${y1.toFixed(2)}, ${(cx+w*0.48).toFixed(2)} ${(cy+h*0.34).toFixed(2)}`,
      `C ${x1.toFixed(2)} ${(cy+h*0.10).toFixed(2)}, ${(cx+w*0.70).toFixed(2)} ${(cy-h*0.20).toFixed(2)}, ${cx.toFixed(2)} ${y0.toFixed(2)}`,
      "Z"
    ].join(" ");
  }

  function eyelidPath(cx,cy,rx,ry,t,upper=true){
    const yShift=(upper?1:-1)*ry*(0.95 - t*1.10);
    const y=cy+yShift, x0=cx-rx, x1=cx+rx;
    const ctrlY=y + (upper?-1:1)*ry*0.55;
    return `M ${x0.toFixed(2)} ${y.toFixed(2)} Q ${cx.toFixed(2)} ${ctrlY.toFixed(2)} ${x1.toFixed(2)} ${y.toFixed(2)} L ${x1.toFixed(2)} ${(cy+(upper?-ry:ry)).toFixed(2)} L ${x0.toFixed(2)} ${(cy+(upper?-ry:ry)).toFixed(2)} Z`;
  }

  // Muzikaz-style ear (bigger, sharper)
  function muzikazEarPath(cx, cy, w, h, side){
    // 4-point jagged ear outline
    const tip = { x: cx + side*w*0.08, y: cy - h };
    const p1  = { x: cx - w*0.62, y: cy + h*0.18 };
    const p2  = { x: cx - w*0.18, y: cy - h*0.18 };
    const p3  = { x: cx + w*0.62, y: cy + h*0.18 };
    const mid = { x: cx + side*w*0.30, y: cy - h*0.10 };

    return [
      `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`,
      `Q ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} ${tip.x.toFixed(2)} ${tip.y.toFixed(2)}`,
      `Q ${mid.x.toFixed(2)} ${(mid.y + h*0.06).toFixed(2)} ${p3.x.toFixed(2)} ${p3.y.toFixed(2)}`,
      `Q ${cx.toFixed(2)} ${(cy + h*0.42).toFixed(2)} ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`,
      "Z"
    ].join(" ");
  }

  function muzikazEarInner(cx, cy, w, h, side){
    const tip = { x: cx + side*w*0.06, y: cy - h*0.78 };
    const p1  = { x: cx - w*0.42, y: cy + h*0.15 };
    const p3  = { x: cx + w*0.42, y: cy + h*0.15 };
    const mid = { x: cx + side*w*0.18, y: cy - h*0.20 };
    return [
      `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`,
      `Q ${(cx - side*w*0.05).toFixed(2)} ${(cy - h*0.18).toFixed(2)} ${tip.x.toFixed(2)} ${tip.y.toFixed(2)}`,
      `Q ${mid.x.toFixed(2)} ${(mid.y + h*0.06).toFixed(2)} ${p3.x.toFixed(2)} ${p3.y.toFixed(2)}`,
      `Q ${cx.toFixed(2)} ${(cy + h*0.28).toFixed(2)} ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`,
      "Z"
    ].join(" ");
  }

  // Horns
  function hornPath(baseX, baseY, w, h, side){
    const tipX=baseX + side*w*0.42;
    const tipY=baseY - h;
    const bL={x:baseX - w*0.50, y:baseY + h*0.06};
    const bR={x:baseX + w*0.50, y:baseY + h*0.06};
    const c1={x:baseX + side*w*1.05, y:baseY - h*0.58};
    return [
      `M ${bL.x.toFixed(2)} ${bL.y.toFixed(2)}`,
      `Q ${(baseX - side*w*0.10).toFixed(2)} ${(baseY - h*0.26).toFixed(2)} ${tipX.toFixed(2)} ${tipY.toFixed(2)}`,
      `Q ${c1.x.toFixed(2)} ${c1.y.toFixed(2)} ${bR.x.toFixed(2)} ${bR.y.toFixed(2)}`,
      `Q ${baseX.toFixed(2)} ${(baseY + h*0.20).toFixed(2)} ${bL.x.toFixed(2)} ${bL.y.toFixed(2)}`,
      "Z"
    ].join(" ");
  }

  function hornRidges(baseX, baseY, w, h, side){
    const lines=[];
    for(let k=1;k<=4;k++){
      const t=k/5;
      const y=baseY - h*(0.10 + 0.70*t);
      const rx=w*(0.40 - 0.12*t);
      const x0=baseX - rx*0.90;
      const x1=baseX + rx*0.90;
      const ctrlX=baseX + side*w*(0.30 + 0.12*t);
      const ctrlY=y - h*0.05;
      lines.push(`M ${x0.toFixed(2)} ${y.toFixed(2)} Q ${ctrlX.toFixed(2)} ${ctrlY.toFixed(2)} ${x1.toFixed(2)} ${y.toFixed(2)}`);
    }
    return lines.join(" ");
  }

  function smoothLandmarks(curr, prev, alpha){
    if(!prev) return curr;
    const out=new Array(curr.length);
    for(let i=0;i<curr.length;i++){
      out[i]={x:lerp(prev[i].x,curr[i].x,alpha), y:lerp(prev[i].y,curr[i].y,alpha), z:lerp(prev[i].z??0,curr[i].z??0,alpha)};
    }
    return out;
  }

  // Teeth generators
  function teethStripPath(x0, x1, yBase, toothH, count, invert=false){
    // builds a jagged strip along x0..x1
    const pts=[];
    const step=(x1-x0)/count;
    for(let i=0;i<=count;i++){
      const x = x0 + step*i;
      pts.push({x, y:yBase});
      if(i<count){
        const tipX = x + step*0.5;
        const tipY = yBase + (invert ? toothH : -toothH);
        pts.push({x: tipX, y: tipY});
      }
    }
    let d=`M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}`;
    for(let i=1;i<pts.length;i++) d += ` L ${pts[i].x.toFixed(2)} ${pts[i].y.toFixed(2)}`;
    // close back slightly
    d += ` L ${x1.toFixed(2)} ${(yBase + (invert? toothH*0.35 : -toothH*0.35)).toFixed(2)}`;
    d += ` L ${x0.toFixed(2)} ${(yBase + (invert? toothH*0.35 : -toothH*0.35)).toFixed(2)} Z`;
    return d;
  }

  function fangPath(cx, cy, w, h, side){
    const x = cx + side*w;
    return `M ${(x-w*0.20).toFixed(2)} ${cy.toFixed(2)} L ${(x+w*0.20).toFixed(2)} ${cy.toFixed(2)} L ${x.toFixed(2)} ${(cy+h).toFixed(2)} Z`;
  }

  // Hat (cap + brim)
  function hatCrownPath(cx, topY, w, h){
    const left = cx - w*0.55, right = cx + w*0.55;
    const y0 = topY;
    const y1 = topY + h;
    return [
      `M ${left.toFixed(2)} ${y1.toFixed(2)}`,
      `Q ${(cx - w*0.55).toFixed(2)} ${(topY + h*0.18).toFixed(2)} ${cx.toFixed(2)} ${y0.toFixed(2)}`,
      `Q ${(cx + w*0.55).toFixed(2)} ${(topY + h*0.18).toFixed(2)} ${right.toFixed(2)} ${y1.toFixed(2)}`,
      `Q ${cx.toFixed(2)} ${(y1 + h*0.20).toFixed(2)} ${left.toFixed(2)} ${y1.toFixed(2)}`,
      "Z"
    ].join(" ");
  }

  function hatBrimPath(cx, y, w, h){
    const left = cx - w*0.72, right = cx + w*0.72;
    const under = y + h;
    return [
      `M ${left.toFixed(2)} ${y.toFixed(2)}`,
      `Q ${cx.toFixed(2)} ${(y - h*0.75).toFixed(2)} ${right.toFixed(2)} ${y.toFixed(2)}`,
      `Q ${(cx + w*0.50).toFixed(2)} ${under.toFixed(2)} ${cx.toFixed(2)} ${under.toFixed(2)}`,
      `Q ${(cx - w*0.50).toFixed(2)} ${under.toFixed(2)} ${left.toFixed(2)} ${y.toFixed(2)}`,
      "Z"
    ].join(" ");
  }

  function logoMPath(cx, cy, s){
    // simple “M” mark
    const w = s, h = s*0.95;
    const x0=cx-w*0.50, x1=cx+w*0.50;
    const y0=cy-h*0.50, y1=cy+h*0.50;
    const mid=cx;
    return [
      `M ${x0.toFixed(2)} ${y1.toFixed(2)}`,
      `L ${x0.toFixed(2)} ${(y0 + h*0.18).toFixed(2)}`,
      `Q ${(x0 + w*0.06).toFixed(2)} ${y0.toFixed(2)} ${(x0 + w*0.20).toFixed(2)} ${y0.toFixed(2)}`,
      `L ${(mid - w*0.08).toFixed(2)} ${y0.toFixed(2)}`,
      `L ${mid.toFixed(2)} ${(y0 + h*0.28).toFixed(2)}`,
      `L ${(mid + w*0.08).toFixed(2)} ${y0.toFixed(2)}`,
      `L ${(x1 - w*0.20).toFixed(2)} ${y0.toFixed(2)}`,
      `Q ${(x1 - w*0.06).toFixed(2)} ${y0.toFixed(2)} ${x1.toFixed(2)} ${(y0 + h*0.18).toFixed(2)}`,
      `L ${x1.toFixed(2)} ${y1.toFixed(2)}`,
      `L ${(x1 - w*0.22).toFixed(2)} ${y1.toFixed(2)}`,
      `L ${(x1 - w*0.22).toFixed(2)} ${(y0 + h*0.34).toFixed(2)}`,
      `L ${(mid + w*0.22).toFixed(2)} ${(y0 + h*0.34).toFixed(2)}`,
      `L ${mid.toFixed(2)} ${(y0 + h*0.62).toFixed(2)}`,
      `L ${(mid - w*0.22).toFixed(2)} ${(y0 + h*0.34).toFixed(2)}`,
      `L ${(x0 + w*0.22).toFixed(2)} ${(y0 + h*0.34).toFixed(2)}`,
      `L ${(x0 + w*0.22).toFixed(2)} ${y1.toFixed(2)}`,
      `Z`
    ].join(" ");
  }

  // FaceMesh
  const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7
  });

  let last=null;

  faceMesh.onResults((results)=>{
    const faces=results.multiFaceLandmarks||[];
    if(!faces.length){ setStatus("No face"); last=null; return; }

    const raw=faces[0];
    const smoothFactor=Number(smoothEl.value)/100;
    const alpha=1 - smoothFactor;
    const lm=smoothLandmarks(raw,last,alpha);
    last=lm;

    const op=Number(maskOpacityEl.value)/100;
    document.getElementById("mask").setAttribute("opacity",op);
    document.getElementById("ears").setAttribute("opacity",op);
    document.getElementById("horns").setAttribute("opacity",op);
    document.getElementById("furShells").setAttribute("opacity",op);
    document.getElementById("hat").setAttribute("opacity",op);

    video.style.opacity = showVideoEl.checked ? "1":"0";

    const P=(i)=>({x:lm[i].x*640, y:lm[i].y*480});

    const top=P(10), chin=P(152), leftSide=P(234), rightSide=P(454);
    const forehead=P(9), leftTemple=P(127), rightTemple=P(356);

    const cx=(leftSide.x+rightSide.x)/2;
    const cy=(top.y+chin.y)/2;
    const faceW=dist(leftSide,rightSide);
    const faceH=dist(top,chin);

    // roll from eye line
    const rOuter=P(33), rInner=P(133), lOuter=P(263), lInner=P(362);
    const rEyeC={x:(rOuter.x+rInner.x)/2, y:(rOuter.y+rInner.y)/2};
    const lEyeC={x:(lOuter.x+lInner.x)/2, y:(lOuter.y+lInner.y)/2};
    const roll=Math.atan2(lEyeC.y-rEyeC.y, lEyeC.x-rEyeC.x);
    const rollDeg=roll*180/Math.PI;

    // yaw proxy
    const yaw=clamp((rightTemple.x-leftTemple.x)/Math.max(1,faceW), -0.30, 0.30);

    // base head points + densify for detail
    const basePts=FACE_OVAL.map(i=>P(i));
    const dense = densify(basePts, 2);

    // expand mesh more like muzikaz: wider cheeks + stronger jaw
    const headPts = dense.map(pt=>{
      const dx=pt.x-cx, dy=pt.y-cy;
      const lower=clamp((pt.y - cy)/(faceH*0.5), 0, 1);
      const upper=clamp((cy - pt.y)/(faceH*0.5), 0, 1);

      // cheeks widen; chin drop; top slightly compressed
      const widen = 1 + 0.28 + lower*0.32;
      const drop  = 1 + lower*0.10;
      const squashTop = 1 - upper*0.05;

      return { x: cx + dx*widen, y: cy + dy*drop*squashTop };
    });

    const headD = closedCatmullRomPath(headPts, 0.72);
    facePath.setAttribute("d", headD);
    clipPathFace.setAttribute("d", headD);

    // gradients track head
    furGrad.setAttribute("cx", cx);
    furGrad.setAttribute("cy", cy - faceH*0.12);
    furGrad.setAttribute("r", faceW*0.78);

    furRimGrad.setAttribute("cx", cx);
    furRimGrad.setAttribute("cy", cy);
    furRimGrad.setAttribute("r", faceW*0.90);

    // fur shells
    const furAmt=Number(furAmountEl.value)/100;
    const amp=faceW*(0.014 + 0.046*furAmt);

    const outer1=furPoints(headPts,cx,cy,amp*1.00,1.0,0.90);
    const outer2=furPoints(headPts,cx,cy,amp*0.72,1.4,0.60);
    const outer3=furPoints(headPts,cx,cy,amp*0.46,1.8,0.38);

    furOuter1.setAttribute("d", closedCatmullRomPath(outer1,0.55));
    furOuter2.setAttribute("d", closedCatmullRomPath(outer2,0.55));
    furOuter3.setAttribute("d", closedCatmullRomPath(outer3,0.55));
    furRim.setAttribute("d", closedCatmullRomPath(outer1,0.55));

    // cheek tufts (muzikaz)
    const cheekY = cy + faceH*0.06;
    const tuftW = faceW*0.22, tuftH=faceH*0.14;
    cheekTuftL.setAttribute("d", roundedOvalPath(cx - faceW*0.40, cheekY, tuftW, tuftH));
    cheekTuftR.setAttribute("d", roundedOvalPath(cx + faceW*0.40, cheekY, tuftW, tuftH));

    // jaw tuft
    jawTufts.setAttribute("d", roundedOvalPath(cx, chin.y + faceH*0.05, faceW*0.22, faceH*0.14));
    jawTufts.setAttribute("transform", `rotate(${rollDeg.toFixed(2)} ${cx.toFixed(2)} ${(chin.y + faceH*0.05).toFixed(2)})`);

    // mouth tracking
    const mouthL=P(61), mouthR=P(291);
    const upperInner=P(13), lowerInner=P(14);
    const mouthWidth=Math.max(1,dist(mouthL,mouthR));
    const mouthOpenRaw=dist(upperInner,lowerInner)/mouthWidth;
    const mouthOpenN=clamp((mouthOpenRaw-0.03)/0.22,0,1);

    // blink
    const rUp=P(159), rDown=P(145), lUp=P(386), lDown=P(374);
    const rEyeW=Math.max(8,dist(rOuter,rInner));
    const lEyeW=Math.max(8,dist(lOuter,lInner));
    const rOpen=dist(rUp,rDown)/rEyeW;
    const lOpen=dist(lUp,lDown)/lEyeW;
    const sens=Number(blinkSenseEl.value)/1000;
    const rBlink=clamp((sens-rOpen)/sens,0,1);
    const lBlink=clamp((sens-lOpen)/sens,0,1);
    const blinkAvg=(rBlink+lBlink)/2;

    // EARS (bigger pointers, hat-aligned)
    const earBaseY = forehead.y + faceH*0.02;
    const earOffsetX = faceW*0.44;
    const earW = faceW*0.24;
    const earH = faceH*0.32;

    const earLCx=cx - earOffsetX;
    const earRCx=cx + earOffsetX;

    const earTwitch = blinkAvg*18;
    const earBounce = mouthOpenN*10;

    const earRotL=(-18 - yaw*70) - earTwitch + earBounce + rollDeg*0.18;
    const earRotR=( 18 - yaw*70) + earTwitch - earBounce + rollDeg*0.18;

    const earLD=muzikazEarPath(earLCx, earBaseY, earW, earH, -1);
    const earRD=muzikazEarPath(earRCx, earBaseY, earW, earH, +1);

    earL.setAttribute("d", earLD); earR.setAttribute("d", earRD);
    earEdgeL.setAttribute("d", earLD); earEdgeR.setAttribute("d", earRD);
    earInnerL.setAttribute("d", muzikazEarInner(earLCx, earBaseY, earW, earH, -1));
    earInnerR.setAttribute("d", muzikazEarInner(earRCx, earBaseY, earW, earH, +1));

    // ear lines
    earLinesL.setAttribute("d", `M ${(earLCx - earW*0.10).toFixed(2)} ${(earBaseY - earH*0.10).toFixed(2)} L ${(earLCx + earW*0.06).toFixed(2)} ${(earBaseY + earH*0.12).toFixed(2)}`);
    earLinesR.setAttribute("d", `M ${(earRCx + earW*0.10).toFixed(2)} ${(earBaseY - earH*0.10).toFixed(2)} L ${(earRCx - earW*0.06).toFixed(2)} ${(earBaseY + earH*0.12).toFixed(2)}`);

    const eTL=`rotate(${earRotL.toFixed(2)} ${earLCx.toFixed(2)} ${earBaseY.toFixed(2)})`;
    const eTR=`rotate(${earRotR.toFixed(2)} ${earRCx.toFixed(2)} ${earBaseY.toFixed(2)})`;

    for (const el of [earL,earEdgeL,earInnerL,earLinesL]) el.setAttribute("transform", eTL);
    for (const el of [earR,earEdgeR,earInnerR,earLinesR]) el.setAttribute("transform", eTR);

    // HORNS (behind hat)
    const hornBaseY = top.y - faceH*0.14;
    const hornOffsetX = faceW*0.24;
    const hornW = faceW*0.20;
    const hornH = faceH*0.36;

    const hornLCx=cx - hornOffsetX;
    const hornRCx=cx + hornOffsetX;

    const hornNod=blinkAvg*2.5;
    const hornRotL=(-10 - yaw*50) + rollDeg*0.20 + hornNod;
    const hornRotR=( 10 - yaw*50) + rollDeg*0.20 - hornNod;

    hornSocketGrad.setAttribute("cx", cx);
    hornSocketGrad.setAttribute("cy", hornBaseY);
    hornSocketGrad.setAttribute("r", hornW*1.6);

    hornSocketL.setAttribute("d", roundedOvalPath(hornLCx, hornBaseY + hornH*0.06, hornW*0.55, hornH*0.22));
    hornSocketR.setAttribute("d", roundedOvalPath(hornRCx, hornBaseY + hornH*0.06, hornW*0.55, hornH*0.22));

    hornL.setAttribute("d", hornPath(hornLCx,hornBaseY,hornW,hornH,-1));
    hornR.setAttribute("d", hornPath(hornRCx,hornBaseY,hornW,hornH,+1));

    hornRidgesL.setAttribute("d", hornRidges(hornLCx,hornBaseY,hornW,hornH,-1));
    hornRidgesR.setAttribute("d", hornRidges(hornRCx,hornBaseY,hornW,hornH,+1));

    hornRootL.setAttribute("d", roundedOvalPath(hornLCx, hornBaseY + hornH*0.08, hornW*0.52, hornH*0.20));
    hornRootR.setAttribute("d", roundedOvalPath(hornRCx, hornBaseY + hornH*0.08, hornW*0.52, hornH*0.20));

    const hTL=`rotate(${hornRotL.toFixed(2)} ${hornLCx.toFixed(2)} ${hornBaseY.toFixed(2)})`;
    const hTR=`rotate(${hornRotR.toFixed(2)} ${hornRCx.toFixed(2)} ${hornBaseY.toFixed(2)})`;

    for (const el of [hornSocketL,hornL,hornRidgesL,hornRootL]) el.setAttribute("transform", hTL);
    for (const el of [hornSocketR,hornR,hornRidgesR,hornRootR]) el.setAttribute("transform", hTR);

    // HAT (front, between horns, like reference)
    // anchor width from temples; position from forehead/top
    const hatW = dist(leftTemple,rightTemple) * 1.15;
    const hatH = faceH * 0.26;
    const hatTopY = top.y - faceH*0.22;
    const crownD = hatCrownPath(cx, hatTopY, hatW, hatH);
    hatCrown.setAttribute("d", crownD);

    const brimY = forehead.y + faceH*0.02;
    const brimH = faceH*0.06;
    hatBrim.setAttribute("d", hatBrimPath(cx, brimY, hatW*0.92, brimH));

    // brim underside shadow
    hatUnder.setAttribute("d", roundedOvalPath(cx, brimY + brimH*0.55, hatW*0.55, brimH*0.40));
    hatUnder.setAttribute("opacity", (0.22 + yaw*0.05).toFixed(2));

    // seam line
    hatSeam.setAttribute("d", `M ${(cx-hatW*0.32).toFixed(2)} ${(brimY-hatH*0.16).toFixed(2)} Q ${cx.toFixed(2)} ${(hatTopY+hatH*0.18).toFixed(2)} ${(cx+hatW*0.32).toFixed(2)} ${(brimY-hatH*0.16).toFixed(2)}`);

    // logo
    const logoCx = cx;
    const logoCy = brimY - hatH*0.20;
    const logoS  = hatW * 0.20;
    const logoD = logoMPath(logoCx, logoCy, logoS);
    hatLogoShadow.setAttribute("d", logoD);
    hatLogoShadow.setAttribute("transform", `translate(2 2) rotate(${rollDeg.toFixed(2)} ${logoCx.toFixed(2)} ${logoCy.toFixed(2)})`);
    hatLogo.setAttribute("d", logoD);

    // rotate hat with head roll (lightly)
    const hatRot = rollDeg * 0.22;
    const hatT = `rotate(${hatRot.toFixed(2)} ${cx.toFixed(2)} ${brimY.toFixed(2)})`;
    for (const el of [hatCrown,hatBrim,hatSeam,hatUnder,hatLogo,hatLogoShadow]) el.setAttribute("transform", hatT);

    // NOSE (green)
    const noseTip=P(1);
    const noseCx=noseTip.x;
    const noseCy=noseTip.y + faceH*0.02;

    const noseW=faceW*0.18;
    const noseH=faceH*0.11;

    noseGrad.setAttribute("cx", noseCx);
    noseGrad.setAttribute("cy", noseCy - noseH*0.20);
    noseGrad.setAttribute("r", Math.max(noseW,noseH)*1.0);

    noseHi.setAttribute("cx", noseCx - noseW*0.18);
    noseHi.setAttribute("cy", noseCy - noseH*0.22);
    noseHi.setAttribute("r", noseW*0.55);

    nose.setAttribute("d", alienNosePath(noseCx,noseCy,noseW,noseH));
    noseHighlight.setAttribute("d", roundedOvalPath(noseCx - noseW*0.15, noseCy - noseH*0.18, noseW*0.28, noseH*0.22));
    nosePlate.setAttribute("d", roundedOvalPath(noseCx, noseCy + noseH*0.22, noseW*0.70, noseH*0.55));
    nosePlate.setAttribute("opacity", (0.16 + mouthOpenN*0.05).toFixed(2));

    const nostrilDx=noseW*0.18;
    nostrilL.setAttribute("cx",(noseCx - nostrilDx).toFixed(2));
    nostrilL.setAttribute("cy",(noseCy + noseH*0.18).toFixed(2));
    nostrilL.setAttribute("rx",(noseW*0.10).toFixed(2));
    nostrilL.setAttribute("ry",(noseH*0.18).toFixed(2));

    nostrilR.setAttribute("cx",(noseCx + nostrilDx).toFixed(2));
    nostrilR.setAttribute("cy",(noseCy + noseH*0.18).toFixed(2));
    nostrilR.setAttribute("rx",(noseW*0.10).toFixed(2));
    nostrilR.setAttribute("ry",(noseH*0.18).toFixed(2));

    // MOUTH + TEETH (muzikaz grin)
    const mouthCx=(mouthL.x+mouthR.x)/2;
    const mouthCy=(mouthL.y+mouthR.y)/2 + faceH*0.09;

    const openRx=faceW*0.17*(1 + mouthOpenN*0.25);
    const openRy=faceH*0.065*(0.65 + mouthOpenN*1.5);

    if(mouthOpenN > 0.02){
      mouthOpen.setAttribute("opacity", 0.85);
      mouthOpen.setAttribute("d", roundedOvalPath(mouthCx,mouthCy,openRx,openRy));
    } else {
      mouthOpen.setAttribute("opacity", 0.0);
      mouthOpen.setAttribute("d", "");
    }

    const grinLift=faceH*0.012;
    mouthLine.setAttribute("d",
      `M ${(mouthCx - openRx*1.25).toFixed(2)} ${(mouthCy - openRy*0.35 + grinLift).toFixed(2)}
       Q ${mouthCx.toFixed(2)} ${(mouthCy + openRy*0.62 + grinLift).toFixed(2)}
         ${(mouthCx + openRx*1.25).toFixed(2)} ${(mouthCy - openRy*0.35 + grinLift).toFixed(2)}`
    );

    const teethAlpha = clamp((mouthOpenN - 0.08)/0.30, 0, 1) * 0.95;
    if(teethAlpha > 0.01){
      teethUpper.setAttribute("opacity", teethAlpha.toFixed(2));
      teethLower.setAttribute("opacity", (teethAlpha*0.85).toFixed(2));
      fangs.setAttribute("opacity", (teethAlpha*0.95).toFixed(2));
      tongue.setAttribute("opacity", (clamp((mouthOpenN-0.25)/0.35,0,1)*0.85).toFixed(2));

      const tx0 = mouthCx - openRx*1.05;
      const tx1 = mouthCx + openRx*1.05;

      teethUpper.setAttribute("d", teethStripPath(tx0,tx1,mouthCy - openRy*0.40, openRy*0.55, 6, false));
      teethLower.setAttribute("d", teethStripPath(tx0,tx1,mouthCy + openRy*0.22, openRy*0.40, 5, true));

      // fangs near corners
      const fangW = openRx*0.12;
      const fangH = openRy*0.78*(0.7 + mouthOpenN*0.6);
      const fangD = [
        fangPath(mouthCx, mouthCy - openRy*0.25, openRx*0.92, fangH, -1),
        fangPath(mouthCx, mouthCy - openRy*0.25, openRx*0.92, fangH, +1)
      ].join(" ");
      fangs.setAttribute("d", fangD);

      // tongue
      tongue.setAttribute("d", roundedOvalPath(mouthCx, mouthCy + openRy*0.32, openRx*0.42, openRy*0.32));
    } else {
      teethUpper.setAttribute("opacity","0.0"); teethUpper.setAttribute("d","");
      teethLower.setAttribute("opacity","0.0"); teethLower.setAttribute("d","");
      fangs.setAttribute("opacity","0.0"); fangs.setAttribute("d","");
      tongue.setAttribute("opacity","0.0"); tongue.setAttribute("d","");
    }

    // BUG EYES
    function irisCenter(side){
      const sets = side==="R"
        ? [[469,470,471,472],[468,469,470,471]]
        : [[474,475,476,477],[473,474,475,476]];
      for(const s of sets){
        if(s.every(i=>lm[i])){
          const pts=s.map(i=>P(i));
          const x=pts.reduce((a,p)=>a+p.x,0)/pts.length;
          const y=pts.reduce((a,p)=>a+p.y,0)/pts.length;
          return {x,y,ok:true};
        }
      }
      return {x:0,y:0,ok:false};
    }

    const rI=irisCenter("R");
    const lI=irisCenter("L");

    const pop = Number(eyePopEl.value)/100; // 1.00..2.20
    const rRx = rEyeW*0.28*pop;
    const lRx = lEyeW*0.28*pop;

    const baseRyR = rEyeW*0.18*pop;
    const baseRyL = lEyeW*0.18*pop;

    const rRy = baseRyR*(1 - rBlink*0.92);
    const lRy = baseRyL*(1 - lBlink*0.92);

    eyeWhiteL.setAttribute("cx", rEyeC.x);
    eyeWhiteL.setAttribute("cy", rEyeC.y);
    eyeWhiteL.setAttribute("rx", rRx);
    eyeWhiteL.setAttribute("ry", Math.max(2.0, rRy));

    eyeWhiteR.setAttribute("cx", lEyeC.x);
    eyeWhiteR.setAttribute("cy", lEyeC.y);
    eyeWhiteR.setAttribute("rx", lRx);
    eyeWhiteR.setAttribute("ry", Math.max(2.0, lRy));

    function pupilPos(eyeC, eyeW, iris){
      if(!iris.ok) return {x:eyeC.x,y:eyeC.y};
      const dx=clamp((iris.x-eyeC.x)/Math.max(1,eyeW), -0.35, 0.35);
      const dy=clamp((iris.y-eyeC.y)/Math.max(1,eyeW), -0.28, 0.28);
      return { x: eyeC.x + dx*(eyeW*0.16), y: eyeC.y + dy*(eyeW*0.12) };
    }

    const pR=pupilPos(rEyeC,rEyeW,rI);
    const pL=pupilPos(lEyeC,lEyeW,lI);

    pupilL.setAttribute("cx", pR.x);
    pupilL.setAttribute("cy", pR.y);
    pupilL.setAttribute("rx", rRx*0.28);
    pupilL.setAttribute("ry", Math.max(2.0, rRy*0.50));

    pupilR.setAttribute("cx", pL.x);
    pupilR.setAttribute("cy", pL.y);
    pupilR.setAttribute("rx", lRx*0.28);
    pupilR.setAttribute("ry", Math.max(2.0, lRy*0.50));

    eyeHL.setAttribute("cx", pR.x - rRx*0.22);
    eyeHL.setAttribute("cy", pR.y - rRy*0.32);
    eyeHR.setAttribute("cx", pL.x - lRx*0.22);
    eyeHR.setAttribute("cy", pL.y - lRy*0.32);

    // eyelids
    const lidAlphaR=clamp(rBlink*1.25,0,1);
    const lidAlphaL=clamp(lBlink*1.25,0,1);

    lidUpperL.setAttribute("d", eyelidPath(rEyeC.x,rEyeC.y,rRx*1.03,baseRyR*1.20,lidAlphaR,true));
    lidLowerL.setAttribute("d", eyelidPath(rEyeC.x,rEyeC.y,rRx*1.03,baseRyR*1.20,lidAlphaR,false));
    lidUpperR.setAttribute("d", eyelidPath(lEyeC.x,lEyeC.y,lRx*1.03,baseRyL*1.20,lidAlphaL,true));
    lidLowerR.setAttribute("d", eyelidPath(lEyeC.x,lEyeC.y,lRx*1.03,baseRyL*1.20,lidAlphaL,false));

    lidUpperL.setAttribute("opacity",(lidAlphaR*0.90).toFixed(2));
    lidLowerL.setAttribute("opacity",(lidAlphaR*0.60).toFixed(2));
    lidUpperR.setAttribute("opacity",(lidAlphaL*0.90).toFixed(2));
    lidLowerR.setAttribute("opacity",(lidAlphaL*0.60).toFixed(2));

    // Brows (muzikaz angry thick)
    const browR1=P(70), browR2=P(63), browR3=P(105);
    const browL1=P(336), browL2=P(296), browL3=P(334);

    const browRaise = (1 - blinkAvg)*10 + mouthOpenN*4;
    const browAnger = clamp((0.18 - (dist(browR2,rEyeC)/faceH))*120, -22, 22);

    function browPath(a,b,c,raisePx,tiltDeg){
      const up=raisePx;
      const tilt=tiltDeg*Math.PI/180;
      const sh=Math.sin(tilt)*10;
      const A={x:a.x,y:a.y-up+sh};
      const B={x:b.x,y:b.y-up-sh};
      const C={x:c.x,y:c.y-up+sh};
      return `M ${A.x.toFixed(2)} ${A.y.toFixed(2)} Q ${B.x.toFixed(2)} ${B.y.toFixed(2)} ${C.x.toFixed(2)} ${C.y.toFixed(2)}`;
    }

    browL.setAttribute("d", browPath(browL1,browL2,browL3,browRaise, -browAnger));
    browR.setAttribute("d", browPath(browR1,browR2,browR3,browRaise,  browAnger));

    // Debug
    if(showDebugEl.checked){
      drawDebugPoints(headPts);
    } else if(debugGroup) {
      debugGroup.innerHTML="";
    }

    setStatus(`Mouth ${(mouthOpenN*100).toFixed(0)}% • Blink ${(blinkAvg*100).toFixed(0)}% • Hat/Ears/Horns locked`);
  });

  async function start(){
    setStatus("Starting camera…");
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user", width:{ideal:1280}, height:{ideal:720}},
      audio:false
    });
    video.srcObject = stream;

    const cam = new Camera(video, {
      onFrame: async ()=>{ await faceMesh.send({image:video}); },
      width:640, height:480
    });
    cam.start();
    setStatus("Running");
  }

  start().catch(err=>{
    console.error(err);
    setStatus("Camera error (use localhost + allow permissions)");
  });
})();
</script>
</body>
</html>
