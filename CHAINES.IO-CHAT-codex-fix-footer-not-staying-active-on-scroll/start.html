<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watchtower Start</title>
  <style>
    :root {
      --bg:#070b16;
      --panel:#10192f;
      --fg:#e9f0ff;
      --muted:#9aaad1;
      --accent:#4cc9ff;
      --accent2:#7c4dff;
      --line:#3a4a75;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 10% 10%,#1a2f5a 0,#070b16 55%);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .card{width:min(560px,92vw);padding:24px;border:1px solid var(--line);border-radius:16px;background:rgba(16,25,47,.9);box-shadow:0 20px 40px rgba(0,0,0,.4);display:grid;gap:12px}
    h1{margin:0;font-size:28px}
    p{margin:0;color:var(--muted)}
    input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0a1224;color:var(--fg)}
    .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
    button,a{padding:10px 14px;border-radius:12px;border:1px solid transparent;font-weight:700;text-decoration:none;cursor:pointer}
    .primary{color:#031018;background:linear-gradient(180deg,var(--accent),var(--accent2))}
    .ghost{background:transparent;color:var(--fg);border-color:var(--line)}
  </style>
</head>
<body>
  <main class="card">
    <h1>Watchtower Mission Control</h1>
    <p>Sign in once, then jump straight into live chat.</p>
    <label for="username">Username</label>
    <input id="username" maxlength="24" placeholder="operator-1" />
    <div class="row">
      <button id="save-login" class="primary" type="button">Save Login</button>
      <a href="/" class="primary">Go Live in Chat</a>
      <a href="/contact" class="ghost">Contact Channels</a>
    </div>
  </main>
  <script>
    const input = document.getElementById('username');
    try { input.value = localStorage.getItem('chaines_username') || ''; } catch {}
    document.getElementById('save-login').addEventListener('click', () => {
      const cleaned = (input.value || '').replace(/[^a-zA-Z0-9_\-.]/g, '').slice(0,24);
      if (!cleaned) return alert('Enter a username first.');
      try { localStorage.setItem('chaines_username', cleaned); } catch {}
      alert('Login saved. Use "Go Live in Chat" to enter the room.');
    });
  </script>
</body>
</html>
