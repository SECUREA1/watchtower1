<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watchtower Contact Channels</title>
  <style>
    :root {
      --bg: #260000;
      --panel: #3d0000;
      --fg: #ffd700;
      --accent: #b30000;
      --lining: #ffd700;
    }
    body {
      margin:0;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height:100vh;
    }
    main { text-align:center; }
    .actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top: 12px; }
    button, a.btn { padding:10px 14px; border-radius:12px; border:1px solid var(--lining); background:var(--accent); color:var(--fg); cursor:pointer; text-decoration:none; font-weight:700; }
    a.btn.ghost { background:transparent; }
  </style>
</head>
<body>
  <main class="contact-page">
    <h1>Contact Us</h1>
    <p>Connect with us live via the chat channels.</p>
    <div class="actions">
      <a class="btn" href="/">Open Global Live Chat</a>
      <a class="btn ghost" href="/chains-ops">Open Ops Channel</a>
    </div>
  </main>
</body>
</html>
