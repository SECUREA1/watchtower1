<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watchtower Contact Channels</title>
  <style>
    :root { --bg:#070b16; --panel:#10192f; --fg:#e9f0ff; --muted:#9aaad1; --accent:#4cc9ff; --line:#3a4a75; }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(760px,100%);display:grid;gap:16px}
    .panel{padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
    h1,h2{margin:0 0 8px}
    p{margin:0;color:var(--muted)}
    .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
    a{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:12px;border:1px solid var(--line);text-decoration:none;color:var(--fg)}
    a.primary{background:linear-gradient(180deg,#4cc9ff,#7c4dff);border-color:transparent;color:#031018;font-weight:700}
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>Watchtower Contact Channels</h1>
      <p>Pick a live channel. These links go directly to active rooms with no socket.io gate.</p>
      <div class="row">
        <a class="primary" href="/">Join Global Watchtower Chat</a>
        <a class="primary" href="/chains-ops">Join Ops Live Channel</a>
        <a href="/start.html">Back to Start</a>
      </div>
    </section>
  </main>
</body>
</html>
