# render.yaml - multi-service for RedNode (static frontend, node ws, python API)
services:
  - type: web
    name: rednode-excavation-site
    runtime: static
    repo: https://github.com/SECUREA1/REDNODE.git
    branch: main
    buildCommand: ""
    staticPublishPath: .
    previews:
      generation: automatic
    plan: starter
    autoDeploy: true

  - type: web
    name: rednode-excavation-ws
    runtime: node
    repo: https://github.com/SECUREA1/REDNODE-EXCAVATION.git
    branch: main
    rootDir: ws-server
    plan: starter
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true

  - type: web
    name: rednode-api
    runtime: python
    repo: https://github.com/SECUREA1/REDNODE.git
    branch: main
    rootDir: .
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 8000 --workers 1
    healthCheckPath: /healthz
    autoDeploy: true
    # Persistent disk for DATA_DIR -> /opt/rednode/data
    disk:
      mountPath: /opt/rednode/data
      sizeGB: 20
    envVars:
      # storage & runtime
      - key: DATA_DIR
        value: "/opt/rednode/data"
      - key: MAX_UPLOAD_BYTES
        value: "2097152"
      - key: STORAGE_BACKEND
        value: "local"
      - key: ALLOW_PUBLIC_INGEST
        value: "0"
      - key: ALLOWED_ORIGINS
        value: "https://rednode-excavation-site.onrender.com"
      - key: LOG_LEVEL
        value: "INFO"

      # GitHub integration (non-secret)
      - key: GITHUB_ENABLED
        value: "1"
      - key: GITHUB_OWNER
        value: "SECUREA1"
      - key: GITHUB_REPO
        value: "REDNODE"
      - key: GITHUB_BRANCH
        value: "main"
      - key: GITHUB_PR_FLOW
        value: "0"

      # Secrets (set in Render UI as secure values)
      - key: GITHUB_TOKEN
        secure: true
        value: ""
      - key: ADMIN_TOKEN
        secure: true
        value: ""

      # Optional S3 (only if STORAGE_BACKEND=s3)
      - key: AWS_ACCESS_KEY_ID
        secure: true
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        secure: true
        value: ""
      - key: AWS_REGION
        value: "us-east-1"
      - key: S3_BUCKET
        value: ""

