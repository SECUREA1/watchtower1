# render.yaml - Render Blueprint for Watchtower unified web + WebSocket service
services:
  - type: web
    name: watchtower
    env: docker
    dockerfilePath: ./ws-server/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      mountPath: /opt/watchtower/data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DB_PATH
        value: "/opt/watchtower/data/app.db"
