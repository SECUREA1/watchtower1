# render.yaml - multi-service for RedNode (static frontend, node ws, python API)
services:
  - type: web
    name: rednode-excavation-site
    runtime: static
    repo: https://github.com/SECUREA1/REDNODE.git
    branch: main
    buildCommand: ""
    staticPublishPath: .
    previews:
      generation: automatic
    plan: starter
    autoDeploy: true
    # Optional envs for the static site (not secrets)
    envVars:
      - key: RN_SITE_NAME
        value: "RedNode"
      - key: RN_API_HINT
        value: "Set API Base in UI (Settings → API Base)"

  - type: web
    name: rednode-excavation-ws
    runtime: node
    repo: https://github.com/SECUREA1/REDNODE-EXCAVATION.git
    branch: main
    rootDir: ws-server
    plan: starter
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Add any runtime configuration here
      - key: NODE_ENV
        value: "production"

  - type: web
    name: rednode-api
    runtime: python
    repo: https://github.com/SECUREA1/REDNODE.git
    branch: main
    rootDir: .
    plan: starter
    # Build: install dependencies from requirements.txt
    buildCommand: pip install -r requirements.txt
    # Use PORT env provided by Render at runtime
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    autoDeploy: true

    # Persistent disk for DATA_DIR -> /opt/rednode/data (ensure you attach in UI)
    disk:
      mountPath: /opt/rednode/data
      sizeGB: 20

    envVars:
      # storage & runtime
      - key: DATA_DIR
        value: "/opt/rednode/data"
      - key: MAX_UPLOAD_BYTES
        value: "2097152"               # 2 MB limit (app expects MAX_UPLOAD_BYTES)
      - key: MAX_IMAGE_SIZE_BYTES
        value: "2097152"               # accepted alternate name for compatibility
      - key: STORAGE_BACKEND
        value: "local"                 # set to "s3" for production object storage
      - key: ALLOW_PUBLIC_INGEST
        value: "0"
      - key: ALLOWED_ORIGINS
        value: "https://rednode-excavation-site.onrender.com,https://rednode-excavation-site.onrender.com/" # comma separated
      - key: LOG_LEVEL
        value: "INFO"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"

      # GitHub integration (non-secret)
      - key: GITHUB_ENABLED
        value: "1"
      - key: GITHUB_OWNER
        value: "SECUREA1"
      - key: GITHUB_REPO
        value: "REDNODE"
      - key: GITHUB_BRANCH
        value: "main"
      - key: GITHUB_PR_FLOW
        value: "0"

      # Optional production security / monitoring
      - key: SENTRY_DSN
        value: ""                      # set in Render as secure if you use Sentry
      - key: JWT_ISSUER
        value: ""                      # optional if you migrate to JWT auth

      # Secrets (set in Render UI as secure values — leave value blank here)
      - key: GITHUB_TOKEN
        secure: true
        value: ""
      - key: ADMIN_TOKEN
        secure: true
        value: ""

      # Optional S3 (only if STORAGE_BACKEND=s3) - mark secure in Render
      - key: AWS_ACCESS_KEY_ID
        secure: true
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        secure: true
        value: ""
      - key: AWS_REGION
        value: "us-east-1"
      - key: S3_BUCKET
        value: ""

      # Optional: feature flags / operational toggles
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "1000"


