# render.yaml - unified Docker deployment for RedNode API + UI
services:
  - type: web
    name: rednode-excavation-ws
    runtime: node
    repo: https://github.com/SECUREA1/REDNODE-EXCAVATION.git
    branch: main
    rootDir: ws-server
    plan: starter
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: "production"

  - type: web
    name: rednode-api
    env: docker
    repo: https://github.com/SECUREA1/REDNODE.git
    branch: main
    rootDir: .
    plan: starter
    buildCommand: docker build -t rednode-api:latest -f Dockerfile.api .
    startCommand: sh -c "uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      mountPath: /opt/rednode/data
      sizeGB: 20
    envVars:
      - key: DATA_DIR
        value: "/opt/rednode/data"
      # Serve the whole repository root so both repo-root HTMLs and site/* are available
      - key: STATIC_DIR
        value: "/app"
      - key: MAX_UPLOAD_BYTES
        value: "2097152"
      - key: STORAGE_BACKEND
        value: "local"
      - key: ALLOW_PUBLIC_INGEST
        value: "0"
      - key: ALLOWED_ORIGINS
        value: "https://rednode-excavation-site.onrender.com,https://rednode.ai"
      - key: LOG_LEVEL
        value: "INFO"
      - key: GITHUB_ENABLED
        value: "1"
      - key: GITHUB_OWNER
        value: "SECUREA1"
      - key: GITHUB_REPO
        value: "REDNODE"
      - key: GITHUB_BRANCH
        value: "main"
      - key: GITHUB_PR_FLOW
        value: "1"
      - key: GITHUB_TOKEN
        secure: true
        value: ""
      - key: ADMIN_TOKEN
        secure: true
        value: ""
