# render.yaml - Render Blueprint for Watchtower API + WebSocket relay
services:
  - type: web
    name: watchtower-ws
    env: docker
    dockerfilePath: ./ws-server/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      mountPath: /opt/rednode/data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DB_PATH
        value: "/opt/rednode/data/app.db"

  - type: web
    name: watchtower-api
    env: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      mountPath: /opt/rednode/data
      sizeGB: 20
    envVars:
      - key: DATA_DIR
        value: "/opt/rednode/data"
      # Serve the whole repository root so both repo-root HTMLs and site/* are available
      - key: STATIC_DIR
        value: "/app"
      - key: MAX_UPLOAD_BYTES
        value: "2097152"
      - key: ALLOW_PUBLIC_INGEST
        value: "0"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: "INFO"
      - key: GITHUB_ENABLED
        value: "1"
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: "main"
      - key: GITHUB_PR_FLOW
        value: "1"
      - key: GITHUB_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: WATCHTOWER_ACCESS_PASSWORD
        sync: false
      - key: WATCHTOWER_ACCESS_CODE
        sync: false
